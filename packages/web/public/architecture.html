<title>Engagement Accounts — Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Architecture diagram — same palette/type as the landing page so it embeds cleanly. */
  :root{
    --bg:#070b11; --bg2:#0b1119; --panel:#121a25; --line:#223042;
    --fg:#eef3f9; --muted:#9bb0c4; --faint:#6a7d93;
    --accent:#5b9dff; --accent2:#49e3c4; --good:#32d49a; --violet:#b48cff;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
    --bg:#eef2f7; --bg2:#e7edf4; --panel:#ffffff; --line:#d8e1ec;
    --fg:#111c28; --muted:#51637a; --faint:#7d8ea3;
    --accent:#2f6fe0; --accent2:#12a98c; --good:#12996a; --violet:#8257d8;
    color-scheme:light;
  }}
  :root[data-theme="dark"]{
    --bg:#070b11; --bg2:#0b1119; --panel:#121a25; --line:#223042;
    --fg:#eef3f9; --muted:#9bb0c4; --faint:#6a7d93;
    --accent:#5b9dff; --accent2:#49e3c4; --good:#32d49a; --violet:#b48cff; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(20px,5vw,56px) max(20px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% -8%, color-mix(in srgb,var(--accent) 18%,transparent), transparent 70%),
      radial-gradient(45% 40% at 85% 10%, color-mix(in srgb,var(--accent2) 11%,transparent), transparent 70%),
      linear-gradient(180deg, var(--bg), var(--bg2) 60%, var(--bg))}
  .wrap{max-width:1000px;margin:0 auto;width:100%}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  h1{font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:-.02em;margin:0 0 26px}
  figure{margin:0}
  .diagram{width:100%;height:auto;display:block}
  figcaption{color:var(--muted);font-size:14px;line-height:1.6;margin-top:22px;max-width:74ch}
  figcaption b{color:var(--fg);font-weight:600}

  /* diagram element styles (page-level, not inside the svg) */
  .node{fill:var(--panel);stroke:var(--line);stroke-width:1.3}
  .node.hero{stroke:var(--accent2);stroke-width:2}
  .node.agent{stroke:var(--accent)}
  .node.policy{stroke:var(--good)}
  .node.arbiter{stroke:var(--violet)}
  .title{fill:var(--fg);font-family:var(--sans);font-weight:600;font-size:14px}
  .title.big{font-size:15.5px}
  .sub{fill:var(--muted);font-family:var(--mono);font-size:11px}
  .mut{fill:var(--faint);font-family:var(--mono);font-size:10.5px}
  .lbl{fill:var(--muted);font-family:var(--mono);font-size:11px}
  .lblbg{fill:var(--bg);opacity:.92}
  .ico{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .s-fg{stroke:var(--fg)} .s-accent{stroke:var(--accent)} .s-good{stroke:var(--good)}
  .s-teal{stroke:var(--accent2)} .s-violet{stroke:var(--violet)} .s-mut{stroke:var(--muted)}
  .f-accent{fill:var(--accent)} .f-good{fill:var(--good)} .f-teal{fill:var(--accent2)}
  .f-violet{fill:var(--violet)} .f-mut{fill:var(--muted)}
  .divider{stroke:var(--line);stroke-width:1}
  .chip{fill:color-mix(in srgb,var(--panel) 50%,transparent);stroke:var(--line);stroke-width:1}
  .chiptx{fill:var(--fg);font-family:var(--mono);font-size:11px;font-weight:500}
  .flow{fill:none;stroke:var(--muted);stroke-width:1.6}
  .flow.accent{stroke:var(--accent)} .flow.good{stroke:var(--good)} .flow.teal{stroke:var(--accent2)}
  .gov{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4}
  .gov.violet{stroke:var(--violet)}
  .mk-mut{fill:var(--muted)} .mk-accent{fill:var(--accent)} .mk-good{fill:var(--good)}
  .mk-teal{fill:var(--accent2)} .mk-violet{fill:var(--violet)}
  .leg{fill:var(--faint);font-family:var(--mono);font-size:10.5px}
</style>

<main class="wrap">
  <p class="eyebrow">Engagement Accounts · architecture</p>
  <h1>How a payment moves &mdash; and who can stop it.</h1>

  <figure>
    <svg class="diagram" viewBox="0 0 1210 690" role="img"
      aria-label="A payer funds a single-use XRPL multisig engagement account and delegates to an AI agent. The agent drafts and signs each payment with one key, below quorum, and submits it to a policy co-signer for review. An attester supplies signed delivery evidence to the co-signer but holds no key. The co-signer checks the payment against the mandate and adds the second signature or refuses; funds never pass through it. The account pays the vendor over x402 or MPP rails once quorum is met. An arbiter is a third signer for disputes. Every decision is recorded on the XRP Ledger.">
      <defs>
        <marker id="aMut" markerWidth="9" markerHeight="7" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="mk-mut" points="0,0 8,3 0,6"/></marker>
        <marker id="aAccent" markerWidth="9" markerHeight="7" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="mk-accent" points="0,0 8,3 0,6"/></marker>
        <marker id="aGood" markerWidth="9" markerHeight="7" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="mk-good" points="0,0 8,3 0,6"/></marker>
        <marker id="aTeal" markerWidth="9" markerHeight="7" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="mk-teal" points="0,0 8,3 0,6"/></marker>
        <marker id="aViolet" markerWidth="9" markerHeight="7" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="mk-violet" points="0,0 8,3 0,6"/></marker>
      </defs>

      <!-- ── legend (top-left) ── -->
      <line class="flow" x1="60" y1="46" x2="92" y2="46"/>
      <text class="leg" x="98" y="50">payment &amp; signatures</text>
      <line class="gov" x1="60" y1="64" x2="92" y2="64"/>
      <text class="leg" x="98" y="68">review / governance</text>

      <!-- ══ NODES ══ -->

      <!-- Payer -->
      <rect class="node" x="360" y="72" width="190" height="84" rx="14"/>
      <circle class="ico s-fg" cx="394" cy="102" r="8"/>
      <line class="ico s-fg" x1="394" y1="110" x2="394" y2="132"/>
      <line class="ico s-fg" x1="380" y1="119" x2="408" y2="119"/>
      <line class="ico s-fg" x1="394" y1="132" x2="384" y2="146"/>
      <line class="ico s-fg" x1="394" y1="132" x2="404" y2="146"/>
      <text class="title" x="430" y="111">Payer / Owner</text>
      <text class="sub" x="430" y="129">human principal</text>

      <!-- Agent -->
      <rect class="node agent" x="360" y="200" width="190" height="84" rx="14"/>
      <rect class="ico s-accent" x="378" y="230" width="32" height="26" rx="6"/>
      <circle class="f-accent" cx="387" cy="243" r="2.8"/>
      <circle class="f-accent" cx="401" cy="243" r="2.8"/>
      <line class="ico s-accent" x1="394" y1="230" x2="394" y2="222"/>
      <circle class="f-accent" cx="394" cy="220" r="2.4"/>
      <line class="ico s-accent" x1="385" y1="250" x2="403" y2="250"/>
      <text class="title" x="430" y="239">AI Agent</text>
      <text class="sub" x="430" y="257">proposes · 1 key</text>

      <!-- Policy Co-signer -->
      <rect class="node policy" x="360" y="328" width="190" height="84" rx="14"/>
      <path class="ico s-good" d="M394 348 L407 354 L407 369 Q407 382 394 390 Q381 382 381 369 L381 354 Z"/>
      <polyline class="ico s-good" points="387,369 392,375 402,362"/>
      <text class="title" x="430" y="360">Policy Co-signer</text>
      <text class="sub" x="430" y="378">MCP service</text>
      <text class="mut" x="430" y="396">enforces mandate</text>

      <!-- Arbiter -->
      <rect class="node arbiter" x="360" y="456" width="190" height="84" rx="14"/>
      <line class="ico s-violet" x1="394" y1="478" x2="394" y2="512"/>
      <line class="ico s-violet" x1="384" y1="512" x2="404" y2="512"/>
      <line class="ico s-violet" x1="378" y1="484" x2="410" y2="484"/>
      <circle class="f-violet" cx="394" cy="479" r="3"/>
      <line class="ico s-violet" x1="378" y1="484" x2="372" y2="496"/>
      <line class="ico s-violet" x1="378" y1="484" x2="384" y2="496"/>
      <line class="ico s-violet" x1="410" y1="484" x2="404" y2="496"/>
      <line class="ico s-violet" x1="410" y1="484" x2="416" y2="496"/>
      <text class="title" x="430" y="490">Arbiter</text>
      <text class="sub" x="430" y="508">resolves disputes</text>

      <!-- Attester (feeds the co-signer; not a key) -->
      <rect class="node" x="40" y="324" width="190" height="92" rx="14"/>
      <ellipse class="ico s-mut" cx="74" cy="370" rx="15" ry="9"/>
      <circle class="f-mut" cx="74" cy="370" r="4"/>
      <text class="title" x="100" y="358">Attester</text>
      <text class="sub" x="100" y="376">delivery oracle</text>
      <text class="mut" x="100" y="394">evidence, not a key</text>

      <!-- Engagement Account (hero, center) -->
      <rect class="node hero" x="700" y="206" width="258" height="200" rx="16"/>
      <path class="ico s-teal" d="M816 230 L816 224 Q816 215 829 215 Q842 215 842 224 L842 230"/>
      <rect class="ico s-teal" x="813" y="230" width="32" height="22" rx="4"/>
      <circle class="f-teal" cx="829" cy="239" r="3"/>
      <line class="ico s-teal" x1="829" y1="242" x2="829" y2="248"/>
      <text class="title big" x="829" y="272" text-anchor="middle">Engagement Account</text>
      <text class="sub" x="829" y="290" text-anchor="middle">single-use XRPL multisig</text>
      <line class="divider" x1="716" y1="302" x2="942" y2="302"/>
      <circle class="f-accent" cx="736" cy="324" r="4"/>
      <text class="sub" x="750" y="328">agent key ×1</text>
      <circle class="f-good" cx="736" cy="346" r="4"/>
      <text class="sub" x="750" y="350">policy co-signer ×1</text>
      <circle class="f-violet" cx="736" cy="368" r="4"/>
      <text class="sub" x="750" y="372">arbiter ×1 (disputes)</text>
      <text class="mut" x="829" y="394" text-anchor="middle">one key alone can’t move funds</text>

      <!-- Rails -->
      <rect class="node" x="1030" y="210" width="150" height="86" rx="14"/>
      <text class="title" x="1105" y="234" text-anchor="middle">Rails</text>
      <rect class="chip" x="1044" y="246" width="48" height="22" rx="11"/>
      <text class="chiptx" x="1068" y="261" text-anchor="middle">x402</text>
      <rect class="chip" x="1100" y="246" width="46" height="22" rx="11"/>
      <text class="chiptx" x="1123" y="261" text-anchor="middle">MPP</text>
      <text class="mut" x="1105" y="285" text-anchor="middle">Stripe · Tempo</text>

      <!-- Vendor -->
      <rect class="node" x="1030" y="344" width="150" height="86" rx="14"/>
      <rect class="ico s-mut" x="1089" y="362" width="32" height="7" rx="2"/>
      <rect class="ico s-mut" x="1091" y="369" width="28" height="22" rx="2"/>
      <rect class="ico s-mut" x="1101" y="378" width="8" height="13"/>
      <text class="title" x="1105" y="408" text-anchor="middle">Vendor</text>
      <text class="sub" x="1105" y="424" text-anchor="middle">gets paid</text>

      <!-- XRP Ledger -->
      <rect class="node" x="40" y="580" width="1140" height="76" rx="14"/>
      <rect class="ico s-mut" x="72" y="604" width="28" height="28" rx="3"/>
      <line class="ico s-mut" x1="78" y1="613" x2="94" y2="613"/>
      <line class="ico s-mut" x1="78" y1="622" x2="94" y2="622"/>
      <text class="title" x="116" y="612">XRP Ledger</text>
      <text class="sub" x="116" y="632">every decision a signed, replayable record · settles in 3–5s</text>
      <text class="mut" x="1156" y="620" text-anchor="end">public · verifiable</text>

      <!-- ══ ARROWS (orthogonal only; horizontal labels sit above the line) ══ -->

      <!-- Payer → Agent : delegates -->
      <line class="gov" x1="455" y1="156" x2="455" y2="200" marker-end="url(#aMut)"/>
      <rect class="lblbg" x="461" y="172" width="66" height="14" rx="3"/>
      <text class="lbl" x="463" y="182">delegates</text>

      <!-- Payer → Account : funds + mandate  (elbow into top edge) -->
      <polyline class="flow" points="550,114 730,114 730,206" marker-end="url(#aMut)"/>
      <rect class="lblbg" x="587" y="97" width="106" height="14" rx="3"/>
      <text class="lbl" x="640" y="108" text-anchor="middle">funds + mandate</text>

      <!-- Agent → Account : drafts + signs (key 1) -->
      <line class="flow accent" x1="550" y1="242" x2="698" y2="242" marker-end="url(#aAccent)"/>
      <rect class="lblbg" x="579" y="225" width="92" height="14" rx="3"/>
      <text class="lbl" x="625" y="236" text-anchor="middle">drafts + signs</text>

      <!-- Agent → Co-signer : submits for review -->
      <line class="gov" x1="455" y1="284" x2="455" y2="328" marker-end="url(#aMut)"/>
      <rect class="lblbg" x="461" y="299" width="124" height="14" rx="3"/>
      <text class="lbl" x="463" y="309">submits for review</text>

      <!-- Attester → Co-signer : attests delivery -->
      <line class="gov" x1="230" y1="370" x2="358" y2="370" marker-end="url(#aMut)"/>
      <rect class="lblbg" x="239" y="353" width="112" height="14" rx="3"/>
      <text class="lbl" x="295" y="364" text-anchor="middle">attests delivery</text>

      <!-- Co-signer → Account : signs or refuses (2nd sig) -->
      <line class="flow good" x1="550" y1="370" x2="698" y2="370" marker-end="url(#aGood)"/>
      <rect class="lblbg" x="576" y="353" width="98" height="14" rx="3"/>
      <text class="lbl" x="625" y="364" text-anchor="middle">signs / refuses</text>

      <!-- Arbiter → Account : signs ruling  (elbow into bottom edge) -->
      <polyline class="gov violet" points="550,498 730,498 730,406" marker-end="url(#aViolet)"/>
      <rect class="lblbg" x="597" y="481" width="86" height="14" rx="3"/>
      <text class="lbl" x="640" y="492" text-anchor="middle">signs ruling</text>

      <!-- Account → Rails : quorum met -->
      <line class="flow teal" x1="958" y1="253" x2="1028" y2="253" marker-end="url(#aTeal)"/>
      <rect class="lblbg" x="960" y="236" width="66" height="14" rx="3"/>
      <text class="lbl" x="993" y="247" text-anchor="middle">quorum ✓</text>

      <!-- Rails → Vendor : pays out -->
      <line class="flow teal" x1="1105" y1="296" x2="1105" y2="342" marker-end="url(#aTeal)"/>
      <rect class="lblbg" x="1111" y="314" width="60" height="14" rx="3"/>
      <text class="lbl" x="1113" y="324">pays out</text>

      <!-- Account → Ledger : recorded -->
      <line class="flow" x1="829" y1="406" x2="829" y2="578" marker-end="url(#aMut)"/>
      <rect class="lblbg" x="835" y="485" width="124" height="14" rx="3"/>
      <text class="lbl" x="837" y="495">recorded on-ledger</text>
    </svg>

    <figcaption>
      The <b>payer</b> funds a single-use account and delegates to an <b>AI agent</b> that holds just one key &mdash; below quorum on its own. The agent <b>drafts and signs</b> each payment, then <b>submits it to the policy co-signer</b> for review. An <b>attester</b> supplies signed delivery evidence (it holds no key). The co-signer checks the payment against the mandate and <b>adds the second signature &mdash; or refuses.</b> Funds never pass through it; the <b>account itself</b> pays the vendor over any rail once quorum is met. An <b>arbiter</b> is a third signer for disputes. Every decision lands on the <b>XRP Ledger</b> as a signed, replayable record.
    </figcaption>
  </figure>
</main>
