name: Deploy demo to GitHub Pages

# Publishes the self-contained web demo (packages/web/public) as a static site.
# The landing page is the entry point; the interactive demo runs in its SIMULATED
# mode (no backend) — the live-Testnet mode needs `npm run web` and is not on Pages.

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site (landing → root, why → /why.html, demo → /demo.html)
        run: |
          set -e
          src=packages/web/public
          mkdir -p _site
          # The public/*.html files are body fragments; the local server wraps them in a
          # document shell and injects a config script. Replicate that exact shell here so
          # the static pages render identically (charset + viewport for mobile).
          head='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Engagement Accounts</title>'
          wrap() { { printf '%s%s</head><body>' "$head" "$2"; cat "$1"; printf '</body></html>'; } > "$3"; }
          # Same URL hooks the local server injects, pointed at the static files.
          # Demo gets no __ENG_API__, so it stays in simulated (no-backend) mode.
          nav='<script>window.__HOME_URL__="index.html";window.__WHY_URL__="why.html";window.__DEMO_URL__="demo.html"</script>'
          wrap "$src/landing.html"      "$nav" _site/index.html
          wrap "$src/why.html"          "$nav" _site/why.html
          wrap "$src/index.html"        "$nav" _site/demo.html
          wrap "$src/architecture.html" '' _site/architecture.html
          # Static assets the pages fetch (e.g. hotel-sim.json, the simulated hotel transcript) are copied as-is.
          find "$src" -maxdepth 1 -type f ! -name '*.html' -exec cp {} _site/ \;
          test -f _site/hotel-sim.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
