name: Deploy demo to GitHub Pages

# Publishes the self-contained web demo (packages/web/public) as a static site.
# The landing page is the entry point; the interactive demo runs in its SIMULATED
# mode (no backend) — the live-Testnet mode needs `npm run web` and is not on Pages.

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site (landing → root, demo → /demo.html)
        run: |
          set -e
          src=packages/web/public
          mkdir -p _site
          # The public/*.html files are body fragments; the local server wraps them in a
          # document shell and injects a config script. Replicate that exact shell here so
          # the static pages render identically (charset + viewport for mobile).
          head='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Engagement Accounts</title>'
          wrap() { { printf '%s%s</head><body>' "$head" "$2"; cat "$1"; printf '</body></html>'; } > "$3"; }
          # Landing = entry point; inject the demo-URL hook the page honours (→ the static demo file).
          wrap "$src/landing.html"      '<script>window.__DEMO_URL__="demo.html"</script>' _site/index.html
          # Demo: no config injection → window.__ENG_API__ undefined → runs in simulated (no-backend) mode.
          wrap "$src/index.html"        '' _site/demo.html
          wrap "$src/architecture.html" '' _site/architecture.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
