name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Offline, same flags as the local lychee 0.20.1 command. The action tag is
      # pinned; lycheeVersion pins the binary the local check was run with.
      - name: Link check (lychee 0.20.1, offline)
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          lycheeVersion: v0.20.1
          fail: true
          checkbox: false
          output: /tmp/lychee.md
          args: "--offline --include-fragments --exclude-path node_modules --no-progress '**/*.md'"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci

      # Typecheck and the test suite resolve the "source" export. dist/ is
      # produced later by Build, so it must not already be in the checkout.
      - name: Dist is absent before typecheck and tests
        run: |
          found=$(find packages -type d -name dist -print)
          if [ -n "$found" ]; then
            echo "dist/ exists before the build step:"
            echo "$found"
            exit 1
          fi
          echo "no packages/*/dist before typecheck and tests"

      - name: Typecheck
        run: npm run typecheck

      - name: Trust model page
        run: npx tsx --conditions=source scripts/check-trust-model.ts

      # The JSON reporter is only so check-counts can read numTotalTests.
      # The suite still runs once. x402 and MPP stay on their own steps.
      - name: Test (core, policy, co-signer, vectors)
        run: npm test -- --reporter=default --reporter=json --outputFile=.vitest-report.json

      - name: Check documented counts
        run: npm run check-counts
        env:
          VITEST_JSON: .vitest-report.json

      - name: Validate templates (V1–V16)
        run: npm run validate-templates

      - name: Cost sheet matches validate-templates and hotelTickets
        run: npm run costs -- --check

      # Implemented rules are L1–L3, L5 and L7–L11. L4 and L6 are not implemented.
      - name: Lint policies (L1–L3, L5, L7–L11)
        run: npm run lint-policies

      - name: x402 + MPP adapter integration
        run: |
          npm run typecheck:x402
          npm run test:x402
          npm run test:mpp

      - name: Conformance vectors are deterministic
        run: |
          npm run vectors:build
          git diff --exit-code -- vectors \
            || (echo "::error::vectors/ changed after rebuild — commit the regenerated vectors" && exit 1)

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Pack smoke
        run: npm run pack-smoke
